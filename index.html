<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuiviProf EPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#071b2f">
<style>
/* VOICE  : carnet de terrain du prof d'EPS, sobre et rapide à remplir au bord du terrain
   IDEA   : le cahier de notes à colonnes, une double page par séance, un intercalaire par cycle
   PICTURE: la grille elle-même, en tête d'écran
   COLOUR / TYPE : charte Mes Apps EPS (nuit bleue, orange / bleu), system-ui
   LAYOUT : barre de classe, onglets de cycles, grille à colonnes figées (élève, classe) */
:root{--bg:#071b2f;--tx:#eef3ff;--mut:rgba(238,243,255,.62);--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--c1:#2ed3a0;--c2:#2f9bff;--c3:#9cf2c9;--ok:#6ff0a0;--ko:#ff8f8f;--cell:#0c2236;--cell2:#0f2a42;--head:#0a1e31;--w0:190px;--w1:76px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:clip}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 8% 4%,rgba(46,211,160,.16),transparent 55%),radial-gradient(ellipse at 94% 96%,rgba(47,155,255,.2),transparent 55%)}
header{display:flex;align-items:center;gap:12px;padding:12px 14px 6px;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(90deg,#4fb3ff,#2ed3a0 55%,#5fe07a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.sp{flex:1}.bil{--w0:230px}.lg{width:42px;height:42px;border-radius:11px;flex:none}
main{padding:0 14px 40px}
.btn{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:800;font-size:.86rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,#16a9b0,#2fbf5c);box-shadow:0 4px 14px #16a9b040;min-height:40px;white-space:nowrap}
.btn.b{background:linear-gradient(135deg,#2f9bff,#0a4fd0);box-shadow:0 4px 14px #0a4fd045}
.btn.r{background:rgba(255,255,255,.08);border:1.5px solid var(--bd);box-shadow:none}
.btn.k{background:linear-gradient(135deg,#ff6b6b,#c21e1e)}
.btn.s{padding:4px 9px;min-height:30px;font-size:.78rem;border-radius:9px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
select,input,textarea{padding:9px 11px;border-radius:11px;border:1.5px solid var(--bd);font:inherit;font-size:16px;background:rgba(0,0,0,.32);color:var(--tx)}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
label{display:block;font-weight:700;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px}
.msg{font-size:.82rem;font-weight:700;min-height:1.2em}
/* onglets = intercalaires des cycles */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 0 0;border-bottom:2px solid var(--c1);scrollbar-width:thin}
.tab{flex:none;border:1.5px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 14px;background:rgba(255,255,255,.05);color:var(--mut);font:inherit;font-weight:800;cursor:pointer;min-height:40px}
.tab.on{background:linear-gradient(135deg,#1976d2,#16b3a8 60%,#34c759);color:#fff;border-color:transparent}
.tab.bil.on{background:linear-gradient(180deg,#2f9bff,#0a4fd0)}
.tab.add{color:var(--c3);border-style:dashed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar h2{margin:0;font-size:1rem;font-weight:900}
.bar .mut{color:var(--mut);font-size:.82rem}
/* grille */
.grid{overflow:auto;max-height:calc(100vh - 205px);border:1px solid var(--bd);border-radius:14px;background:var(--cell)}
table{border-collapse:separate;border-spacing:0;font-size:.86rem}
th,td{border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);padding:3px 5px;text-align:center;white-space:nowrap;background:var(--cell)}
tbody tr:nth-child(even) td{background:var(--cell2)}
thead th{position:sticky;background:var(--head);z-index:3}
thead tr.r1 th{top:0;height:52px}thead tr.r2 th{top:52px}
.st0,.st1{position:sticky;z-index:2;text-align:left}
.st0{left:0;width:var(--w0);min-width:var(--w0);max-width:var(--w0);overflow:hidden;text-overflow:ellipsis}
.st1{left:var(--w0);width:var(--w1);min-width:var(--w1);max-width:var(--w1);overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:.76rem;box-shadow:3px 0 6px #0006}
thead .st0,thead .st1{z-index:5}
tfoot td{position:sticky;bottom:0;background:#08192a!important;color:var(--c3);font-size:.74rem;z-index:3;border-top:2px solid var(--bd)}
tfoot .st0,tfoot .st1{z-index:5}
.sg{border-left:3px solid var(--c1)!important}
.sh{min-width:120px;text-align:left;padding:4px 8px}
.sh b{display:block;font-size:.9rem;color:var(--c3)}
.sh small{color:var(--mut);display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.sh .ac{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle;align-items:center}
.sh .ac .btn{min-height:38px;padding:4px 10px;border-radius:10px;font-size:.84rem;background:rgba(46,211,160,.16);border:1.5px solid rgba(46,211,160,.7);color:#fff;box-shadow:none}
.sh .ac .btn:hover{background:rgba(46,211,160,.32)}
.sh .ac .ico{min-width:40px;font-size:1.35rem;font-weight:900;line-height:1;padding:2px 8px}
.sh .ac .btn[data-a=addcol]{background:linear-gradient(135deg,#2f9bff,#1565c0);border-color:#8cc8ff;box-shadow:0 2px 10px #1565c099}.sh .ac .btn[data-a=addcol]:hover{background:linear-gradient(135deg,#55adff,#1976d2)}
.sh .ac .btn[data-a=smenu]{background:linear-gradient(135deg,#16b3a8,#2fbf5c);border-color:#8ef0c8;box-shadow:0 2px 10px #16b3a899}.sh .ac .btn[data-a=smenu]:hover{background:linear-gradient(135deg,#22cbbf,#3fd46c)}
.ch.add{font-size:1.5rem;font-weight:900;border:1.5px dashed rgba(46,211,160,.7);border-radius:10px;min-width:44px;min-height:40px}
.ch{font:inherit;font-size:.78rem;font-weight:700;color:var(--tx);background:none;border:0;cursor:pointer;padding:4px 2px;line-height:1.15}
.ch small{display:block;color:var(--mut);font-weight:600;font-size:.68rem}
.ch.add{color:var(--c3);font-size:1.1rem;padding:6px 10px}
.nm{font:inherit;color:var(--tx);background:none;border:0;cursor:pointer;text-align:left;padding:6px 2px;width:100%;overflow:hidden;text-overflow:ellipsis}
.nm b{font-weight:800}
/* Élève sur deux lignes : NOM puis prénom, même hauteur pour toutes les lignes ; chaque ligne est coupée par « … » seulement si elle dépasse la colonne */
.nm{display:block;white-space:nowrap;line-height:1.22;padding:4px 2px;min-height:40px}.nm b{display:block;overflow:hidden;text-overflow:ellipsis}.nm span.pn{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--mut)}
td.st0>b{display:block;overflow:hidden;text-overflow:ellipsis}td.st0>span.pn{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:.92em}
.ck{width:100%;min-width:44px;min-height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.04);color:var(--tx);font:inherit;font-weight:900;font-size:.95rem;cursor:pointer}
.ck.auto{font-style:italic;opacity:.75;outline:1px dashed #6fb7ff}
.vVS{background:#3f5f8f;color:#e6efff;font-size:.82rem}.vP,.v\+{background:#1d6b3f;color:#d9ffe7}.vA,.vI{background:#8f1d1d;color:#ffe0e0}.vR,.v−{background:#d4a514;color:#1d1a05}
.vDT{background:#1d4f9f;color:#e0ecff}.vDP{background:#2c6fb8;color:#e0ecff}.vIN{background:#4b3a9f;color:#ece6ff}
.vX{background:#7b52d6;color:#fff}
.in{width:84px;padding:6px 7px;border-radius:8px;font-size:15px;text-align:right}
.in.tx{width:190px;text-align:left}
td select.in{width:auto;text-align:left}
.calc{font-weight:800;color:var(--c3);min-width:64px}
.mk{width:68px;min-width:68px;max-width:68px;white-space:normal;padding-inline:3px}.mk .ch{width:100%}.mk .btn.s{padding:4px 6px}
.fold{color:var(--mut);font-size:.75rem;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.empty{border:2px dashed var(--bd);border-radius:18px;padding:28px;text-align:center;color:var(--mut);margin:14px 0}
.empty b{color:var(--tx);display:block;font-size:1.05rem;margin-bottom:6px}
/* bilan */
.bt td.z{color:rgba(255,255,255,.25)}
.bt td.h{font-weight:900}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c1)}
.up{color:var(--ok);font-size:.72rem}.dn{color:var(--ko);font-size:.72rem}
/* fenêtres */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:4vh 10px;overflow:auto}
.mo{background:#0d2338;border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(560px,100%);box-shadow:0 20px 60px #000c}
.mo h3{margin:0 0 6px;font-size:1.05rem;color:var(--c3)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.tg button{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--bd);border-radius:12px;padding:10px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.tg button.on{border-color:var(--c1);background:rgba(46,211,160,.18)}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-weight:600;margin:6px 0}
.chk input{width:20px;height:20px;margin:0}
.refs{max-height:190px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:4px 10px}
.help{color:var(--mut);font-size:.78rem;margin:4px 0}
.code{display:inline-block;background:#9cf2c922;color:var(--c3);border-radius:6px;padding:0 5px;font-weight:800;font-size:.75rem}
.fi h4{margin:14px 0 4px;color:var(--c1);font-size:.85rem}
.fi .se{border-left:3px solid var(--bd);padding:2px 0 2px 10px;margin:6px 0}
.fi .se b{color:var(--c3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:rgba(255,255,255,.08);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:700}
.dl{width:100%;font-size:.85rem}.dl td{text-align:left;white-space:normal}
td.fut,.fut>small,.fut .fold{opacity:.45}.sh.fut>b{color:rgba(156,242,201,.5)}
.fut.cur>b,.fut.cur>small{opacity:1}
.gc{display:flex;align-items:center;gap:3px;min-height:36px;min-width:112px;border:1px solid var(--bd);border-radius:8px;background:rgba(255,255,255,.04);color:var(--tx);font:inherit;font-size:.82rem;cursor:pointer;padding:3px 8px}
.gc i{width:9px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.3);flex:none}.gc b{margin-left:5px;white-space:nowrap;color:var(--c3)}
#mo:has(.gt){width:min(980px,100%)}
.gt{border-collapse:separate;border-spacing:4px;width:100%;font-size:.8rem}
.gt th{background:rgba(255,255,255,.07);padding:6px 8px;border-radius:8px;white-space:normal;text-align:left;font-size:.78rem;min-width:110px}
.gt td{padding:0;background:none!important;border:0;white-space:normal;vertical-align:stretch}
.gk{width:100%;height:100%;min-height:56px;min-width:110px;border:1.5px solid var(--lc);border-radius:9px;background:color-mix(in srgb,var(--lc) 14%,transparent);color:var(--tx);font:inherit;font-size:.76rem;cursor:pointer;padding:6px;text-align:left;line-height:1.25}
.gk.on{background:var(--lc);color:var(--lt);font-weight:800;box-shadow:inset 0 0 0 2px #fff}
.gn{font-size:.95rem;margin:10px 0 4px}
.ci{display:block;font-size:1.6rem;line-height:1.15;margin:0 auto 3px;text-align:center;font-style:normal}
.mt td{white-space:normal}.mt th small{color:var(--mut);font-weight:600}textarea.app{width:100%;min-width:260px;min-height:54px;font-size:14px;padding:6px 8px;resize:vertical;line-height:1.35}
.btn.fd{display:block;margin:4px auto 2px;width:100%;min-height:36px;background:linear-gradient(135deg,#1976d2,#16b3a8 60%,#34c759);box-shadow:0 3px 10px #16b3a840;font-size:.82rem}
th.cur{box-shadow:inset 0 -3px 0 var(--c1)}th.sh.cur.fut{box-shadow:inset 0 -3px 0 var(--c2)}th.sh.cur.fut b::after{content:' ● prochaine séance';color:#6fb7ff}th.sh.cur b::after{content:' ● séance en cours';color:var(--c1);font-size:.7rem;font-weight:800}.ann{opacity:.4;text-decoration:line-through}th.today{box-shadow:inset 0 -3px 0 var(--ok)}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}.og .card{margin:0}
.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}.rw input,.rw select{padding:6px 8px;font-size:15px}.rw input[type=text]{flex:1;min-width:120px}
.rw label{margin:0}.rw label input,.rw label select{margin-top:2px}
.wks{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:5px}
.wks button{border:1px solid var(--bd);border-radius:9px;padding:5px 7px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:.75rem;cursor:pointer;text-align:left;min-height:44px}
.wks button b{float:right;font-size:.95rem}.wks .A b{color:var(--c1)}.wks .B b{color:var(--c2)}.wks .fl{border-color:var(--c3)}.wks .vac{opacity:.35;cursor:default}.wks small{color:var(--mut)}
.cyt{width:100%;font-size:.85rem;border-collapse:collapse}.cyt td{white-space:normal;text-align:left;vertical-align:top;background:transparent!important;padding:6px 4px}.cyt input[type=date]{padding:5px 6px;font-size:14px}
.ok{color:var(--ok)}
@media(max-width:600px){:root{--w0:128px;--w1:56px}.bil{--w0:150px}header{padding:10px}h1{font-size:1.1rem}.hide-s{display:none}.grid{max-height:calc(100vh - 235px)}}
/* menu bas */
main{padding-bottom:96px!important}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:rgba(4,20,36,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);box-shadow:0 -6px 20px #0008}
.bnav button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:14px;padding:6px 4px;background:none;color:var(--mut);font:inherit;font-size:.74rem;font-weight:800;cursor:pointer;min-height:54px;line-height:1.1;text-align:center}
.bnav button b{font-size:1.3rem;line-height:1}
.bnav button.on{color:#fff;background:linear-gradient(135deg,rgba(25,118,210,.6),rgba(22,179,168,.55) 60%,rgba(52,199,89,.5))}
.bnav button:not(.on):hover{color:var(--tx);background:rgba(255,255,255,.06)}
.ocl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ocl button{border:1.5px solid var(--bd);border-radius:20px;padding:6px 14px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-weight:800;cursor:pointer;min-height:38px}
.ocl button.on{border-color:transparent;background:linear-gradient(135deg,#1976d2,#16b3a8 60%,#34c759);color:#fff}
.ovt tr[data-o]{cursor:pointer}.ovt tr[data-o]:hover td{background:rgba(255,255,255,.06)!important}.ovt tr.on td{background:rgba(46,211,160,.12)!important}
.ovt td,.ovt th{white-space:normal;text-align:left;vertical-align:top}
#bBak.warn{box-shadow:0 0 0 2px #ffb020,0 0 14px #ffb02099;animation:bakp 2s infinite}@keyframes bakp{50%{box-shadow:0 0 0 2px #ffb02055}}
</style>


<style id="titre-moderne">/* En-tête aux couleurs du logo (bleu, turquoise, vert), sur le modèle de CompEval */
header{position:relative;padding:16px 16px 14px!important;gap:14px!important}
header::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#1f8fe0 15%,#11af9d 50%,#4cd964 85%,transparent)}
header img.lg{width:64px!important;height:64px!important;border-radius:22%!important;box-shadow:0 0 0 2px rgba(255,255,255,.28),0 0 24px rgba(17,175,157,.5),0 6px 16px rgba(0,0,0,.45)!important;transition:transform .3s}
header img.lg:hover{transform:rotate(-5deg) scale(1.05)}
header .ttl{min-width:0}
header h1{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-style:italic!important;font-weight:900!important;text-transform:none!important;letter-spacing:.005em!important;line-height:1.05;font-size:1.9rem!important;background:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 0 #03263a,0 4px 14px rgba(0,0,0,.5)!important;white-space:nowrap}
header h1 .tm{background:linear-gradient(180deg,#8ff5a8,#34c759 55%,#11af9d)!important;-webkit-background-clip:text!important;background-clip:text!important;color:#34c759!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 2px 0 #03263a)}
header .ttl p{margin:4px 0 0;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,240,255,.65)}
@media(max-width:600px){header img.lg{width:48px!important;height:48px!important}header h1{font-size:1.4rem!important}header .ttl p{display:none}}
</style>
</head>
<body>
<header>
 <img src="icons/icon-192.png" alt="" class="lg"><div class="ttl"><h1>SuiviProf <span class="tm">EPS</span></h1><p>Carnet de suivi des séances · Mes Apps EPS</p></div>
 <select id="cls" aria-label="Classe" hidden></select>
 <span class="sp"></span>
 <span class="msg" id="st"></span>
 <button class="btn b" id="bSync" hidden title="Enregistrer les saisies dans la base Mes Apps EPS">💾 <span class="hide-s">Mes Apps EPS</span></button>
 <button class="btn r" id="bBak" title="Sauvegarder le carnet (cycles, séances, saisies et grilles CompEval) dans un fichier .json">📒 <span class="hide-s">Sauvegarder le carnet</span></button>
 <button class="btn r" id="bXls" hidden title="Exporter la feuille SuiviProf de la classe (.xlsx)">⬇ <span class="hide-s">.xlsx</span></button>
</header>
<main>
 <nav class="tabs" id="tabs" hidden></nav>
 <section id="view"></section>
</main>
<nav class="bnav" id="bnav" aria-label="Menu de l'application">
 <button data-nav="carnet"><b>📒</b>Carnet</button>
 <button data-nav="bilan"><b>📊</b>Bilan</button>
 <button data-nav="org"><b>📅</b>Organisation annuelle</button>
 <button data-nav="set"><b>⚙️</b>Réglages</button>
</nav>
<datalist id="apsaL"></datalist>
<div class="ov" id="ov" hidden><div class="mo" id="mo"></div></div>
<input type="file" id="fList" accept=".csv,text/csv,.xlsx" multiple hidden>
<input type="file" id="fJson" accept=".json" hidden>
<input type="file" id="fProg" accept=".json,application/json" hidden>
<script src="version.js"></script>
<script src="eps-core.js"></script>
<script>
{
const APP='suiviprof',LS='SuiviProfEPS_carnet_v1';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const frD=s=>{if(!s)return'';const d=new Date(s+'T12:00');return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})};

/* ───── Types de colonnes : chacun porte sa catégorie de bilan ───── */
const TYPES={
 appel:{l:'Appel',n:'Appel',i:'✅',cat:'Assiduité',k:'cycle',st:['','P','A','R','VS'],lab:{P:'Présent',A:'Absent',R:'Retard',VS:'Absent (saisi par la vie scolaire)'}},

 if(col.type==='dispense'){const x=v||dispAuto(eid,s.date);return x?t.lab[x]:''}
 if(t.k==='cycle')return v?t.lab[v]:'';if(t.k==='toggle')return v?t.lab:'';if(t.k==='grid')return gTxt(col,v);
 if(NUMK.includes(t.k))return fmt(col,numv(c,col,eid));return v||''}

/* ───── Rendu général ───── */
const cmpCl=(a,b)=>a.localeCompare(b,'fr',{numeric:true});
const grpCls=()=>[...new Set(E.flatMap(grpOf))].sort(cmpCl);
/* Classe « dépendante » d'un groupe : tous ses élèves sont suivis dans au moins un groupe d'enseignement.
   Elle n'a pas de carnet propre (ni dans le Carnet, ni dans l'Organisation annuelle, ni pour les périodes interruptives) :
   tout se fait dans le groupe. Exception : une classe dont le carnet contient déjà des saisies reste affichée. */
const carnetRempli=cl=>{const K=S.classes[cl];return!!K&&(K.cycles||[]).some(c=>c.seances.some(s=>hasData(c,s)))};
function depCls(){const G=new Set(E.flatMap(grpOf)),by=new Map();
 E.forEach(e=>{if(!e.classe)return;const x=by.get(e.classe)||{n:0,g:0};x.n++;if(grpOf(e).length)x.g++;by.set(e.classe,x)});
 return new Set([...by].filter(([c,x])=>x.g===x.n&&!G.has(c)&&!carnetRempli(c)).map(([c])=>c))}
const allCls=()=>{const D=depCls();return[...new Set([...E.map(e=>e.classe).filter(c=>c&&!D.has(c)),...E.flatMap(grpOf)])].sort(cmpCl)};
function fitGrid(){const g=document.querySelector('#view .grid.main');if(!g)return;const top=g.getBoundingClientRect().top+scrollY,nb=$('#bnav').offsetHeight;g.style.maxHeight=Math.max(280,innerHeight-top-nb-14)+'px'}
addEventListener('resize',fitGrid);

 document.querySelectorAll('#bnav [data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===V));
 $('#cls').hidden=!has||V==='org';$('#bSync').hidden=$('#bXls').hidden=!has||V==='org';$('#tabs').hidden=!has||V!=='carnet';
 if(V==='org')return renderOrg();
 if(!has){$('#view').innerHTML=`<div class="empty"><b>Aucune liste d'élèves sur cet appareil</b>Importez directement l'export Pronote de vos classes (.csv, plusieurs fichiers possibles),<br>ou ouvrez SuiviProf EPS depuis le portail Mes Apps EPS : la liste y est partagée automatiquement.<div class="bar" style="justify-content:center;margin-top:16px"><button class="btn" data-g="list">📂 Importer une liste Pronote (.csv)</button><button class="btn r" data-g="demo">🧪 Essayer avec une classe exemple</button></div></div>`;return}
 if(!cl.includes(S.classe))S.classe=cl[0];
 {const G=grpCls(),opt=c=>`<option value="${esc(c)}" ${c===S.classe?'selected':''}>${esc(c)}</option>`;
  $('#cls').innerHTML=G.length?`<optgroup label="Classes">${cl.filter(c=>!G.includes(c)).map(opt).join('')}</optgroup><optgroup label="Groupes d'enseignement">${G.map(opt).join('')}</optgroup>`:cl.map(opt).join('')}
 if(V==='bilan')return renderBilan();
 const k=C();if(AUTO){AUTO=false;const f=focusSeance(k);FOC=f?f.s.id:null;if(f)k.tab=f.c.id;$('#view').dataset.cy=''}
 if(!k.cycles.some(c=>c.id===k.tab))k.tab=[...k.cycles].sort((a,b)=>(a.du||'9').localeCompare(b.du||'9'))[0]?.id||null;
 $('#tabs').innerHTML=[...k.cycles].sort((a,b)=>(a.du||'9').localeCompare(b.du||'9')).map(c=>`<button class="tab ${c.id===k.tab?'on':''}" data-t="${c.id}" title="${esc(CAS[c.ca]||'')}">${esc(cyName(c))}</button>`).join('')
  +`<button class="tab add" data-g="cycle">＋ Cycle</button>`;
 if(!k.tab){$('#view').innerHTML=`<div class="empty"><b>Aucun cycle pour ${grpCls().includes(S.classe)?'le groupe':'la classe'} ${esc(S.classe)}</b>Créez un cycle ici, ou programmez d'un coup tous les cycles de l'année (dates, créneaux, APSA) dans l'Organisation annuelle.<div class="bar" style="justify-content:center;margin-top:16px"><button class="btn" data-g="cycle">＋ Cycle</button><button class="btn r" data-nav="org" data-oc="${esc(S.classe)}">📅 Organisation annuelle</button></div></div>`;return}
 renderCycle()}

 const g=v.querySelector('.grid'),sc=g&&v.dataset.cy===c.id?[g.scrollLeft,g.scrollTop]:null;v.dataset.cy=c.id;

  +`</tr><tr class="r2">`
  +c.seances.map(s=>folded(s)||!s.cols.length?`<th class="sg${s.date>today()?' fut':''}">${folded(s)?`<span class="fold">${s.annulee?'annulée':s.date>today()?'à venir':hasData(c,s)?'repliée':'non saisie'}</span><button class="btn s fd" data-a="fold" data-s="${s.id}" title="Afficher les colonnes de la séance">▸ Déplier</button>`:`<button class="ch add" data-a="addcol" data-s="${s.id}">＋</button>`}</th>`
   :s.cols.map((col,j)=>`<th class="${j?'':'sg'}${MARK.includes(col.type)?' mk':''}"><button class="ch" data-a="col" data-s="${s.id}" data-c="${col.id}" title="Modifier la colonne"><span class="ci">${T(col).i}</span>${esc(col.nom)}<small><span class="code">${col.code}</span>${MARK.includes(col.type)?'':' '+esc(col.cat)}</small></button>${col.type==='appel'?`<br><button class="btn s b" data-a="allp" data-c="${col.id}">Tous P</button>`:''}</th>`).join('')).join('')
  +`</tr></thead><tbody>`
  +L.map(e=>`<tr><td class="st0"><button class="nm" title="${esc(e.nom.toUpperCase()+' '+e.prenom)}" data-a="fiche" data-e="${esc(e.id)}"><b>${esc(e.nom.toUpperCase())}</b><span class="pn">${esc(e.prenom)}</span></button></td><td class="st1">${esc(e.classe)}</td>`
   +c.seances.map(s=>folded(s)||!s.cols.length?`<td class="sg fold${s.date>today()?' fut':''}">${esc(s.cols.map(col=>txtShort(c,s,col,e.id)).filter(Boolean).join(' · '))}</td>`:s.cols.map((col,j)=>cell(c,s,col,e,j)).join('')).join('')+'</tr>').join('')
  +`</tbody><tfoot><tr id="tf">${foot(c,L)}</tr></tfoot></table></div>`;
 v.innerHTML=h;
 const n=v.querySelector('.grid');if(sc){n.scrollLeft=sc[0];n.scrollTop=sc[1]}
 else{const ths=[...n.querySelectorAll('th[data-sid]')],t=n.querySelector(`th[data-sid="${FOC}"]`)||ths.filter(x=>(c.seances.find(y=>y.id===x.dataset.sid)||{}).date<=today()).pop();
  if(t){const st=n.querySelector('thead .st1');n.scrollLeft=Math.max(0,t.offsetLeft-st.offsetLeft-st.offsetWidth-12)}}
 fitGrid()}

function txtShort(c,s,col,eid){const t=T(col),v=raw(c,col,eid);if(col.type==='dispense'){return v||dispAuto(eid,s.date)}
 if(t.k==='cycle')return v||'';if(t.k==='toggle')return v?t.i:'';if(t.k==='text')return v?'📝':'';if(t.k==='grid'){const x=numv(c,col,eid);return x==null?(gHas(v)?'🧩':''):fmt(col,x)}return txt(c,s,col,eid)}

function cell(c,s,col,e,j){const t=T(col),v=raw(c,col,e.id),b=(j?'':'sg')+(MARK.includes(col.type)?' mk':''),da=`data-c="${col.id}" data-e="${esc(e.id)}"`;
 if(t.k==='cycle'){let x=v||'',auto='';if(col.type==='dispense'&&!v){x=dispAuto(e.id,s.date);if(x)auto=' auto'}
  return `<td class="${b}"><button class="ck v${x==='!'?'I':x}${auto}" data-a="cyc" ${da} title="${esc(x?t.lab[x]:t.l)}${auto?' (période de dispense)':''}">${esc(x)}</button></td>`}
 if(t.k==='toggle')return `<td class="${b}"><button class="ck ${v?'vX':''}" data-a="tog" ${da} title="${esc(t.l)}">${v?t.on:''}</button></td>`;
 if(t.k==='select'){const o=(col.o.liste||'').split(',').map(x=>x.trim()).filter(Boolean);
  return `<td class="${b}"><select class="in" data-a="sel" ${da}><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></td>`}
 if(t.k==='grid'){const g=col.o.g,sc=gHas(v)?gScore(g,v):null;return `<td class="${b}"><button class="gc" data-a="grid" ${da} title="Évaluer avec la grille « ${esc(g.nom)} »">${g.items.map((it,i)=>{const j=v&&(v.c||[])[i],lv=j!=null&&g.niveaux[j];return `<i style="${lv?'background:'+hexOk(lv.couleur)+';border-color:'+hexOk(lv.couleur):''}"></i>`}).join('')}<b>${sc&&sc.n?esc(fmt(col,sc.note)):'Évaluer'}</b>${v&&v.com?'💬':''}</button></td>`}
 if(t.k==='calc')return `<td class="${b} calc" data-calc="${col.id}" data-e="${esc(e.id)}">${esc(fmt(col,calc(c,col,e.id)))}</td>`;
 if(t.k==='text')return `<td class="${b}"><input class="in tx" data-a="in" ${da} value="${esc(v||'')}" title="${esc(v||'')}"></td>`;
 const shown=v==null?'':col.type==='temps'?fmtT(v):String(v).replace('.',',');
 return `<td class="${b}"><input class="in" inputmode="decimal" data-a="in" ${da} value="${esc(shown)}" placeholder="${col.type==='temps'?'m:ss':esc(col.o.unite||'')}"></td>`}

function foot(c,L){return `<td class="st0">Classe</td><td class="st1"></td>`+c.seances.map(s=>folded(s)||!s.cols.length?'<td class="sg"></td>':s.cols.map((col,j)=>{const t=T(col);let x='';
  if(t.k==='cycle'){const n={};L.forEach(e=>{const v=raw(c,col,e.id)||(col.type==='dispense'?dispAuto(e.id,s.date):'');if(v)n[v]=(n[v]||0)+1});x=t.st.filter(k=>n[k]).map(k=>k+n[k]).join(' ')}
  else if(t.k==='toggle')x=L.filter(e=>raw(c,col,e.id)).length||'';
  else if(t.k==='select'){const n={};L.forEach(e=>{const v=raw(c,col,e.id);if(v)n[v]=(n[v]||0)+1});x=Object.entries(n).map(([k,v])=>k+':'+v).join(' ')}
  else if(t.k==='text')x=L.filter(e=>raw(c,col,e.id)).length?L.filter(e=>raw(c,col,e.id)).length+' obs.':'';
  else{const ns=L.map(e=>numv(c,col,e.id)).filter(v=>v!=null);if(ns.length){const m=ns.reduce((a,b)=>a+b,0)/ns.length,bs=bestDir(col)==='min'?Math.min(...ns):Math.max(...ns);x=`moy ${fmt(col,m)}<br>meill. ${fmt(col,bs)}`}}
  return `<td class="${j?'':'sg'}${MARK.includes(col.type)?' mk':''}">${typeof x==='string'&&x.includes('<br>')?x:esc(x)}</td>`}).join('')).join('')}

function refreshLive(){const c=cy(),L=pupils();document.querySelectorAll('[data-calc]').forEach(td=>{const col=allCols(c).find(x=>x.col.id===td.dataset.calc)?.col;if(col)td.textContent=fmt(col,calc(c,col,td.dataset.e))});
 const f=$('#tf');if(f)f.innerHTML=foot(c,L)}

/* ───── Bilan de la classe ───── */
/* ───── Notes et moyennes : colonnes notées = grilles CompEval et colonnes « Nombre / note » ayant une valeur « Sur » ;
   chaque note est ramenée sur 20 et pondérée par le coefficient de sa colonne ───── */
const isNote=col=>col.type==='grille'||(col.type==='nombre'&&gN(col.o.max)>0);
const noteSur=col=>col.type==='grille'?(gN(col.o.g&&col.o.g.sur)||20):gN(col.o.max);
const coefOf=col=>col.o.coef==null||col.o.coef===''?1:gN(col.o.coef);
function notes(K,eid,P){const out=[];for(const c of K.cycles)for(const s of c.seances){if(s.annulee||P&&(s.date<P.du||s.date>P.au))continue;
 for(const col of s.cols){if(!isNote(col))continue;const v=numv(c,col,eid),k=coefOf(col);if(v==null||!(k>0))continue;out.push({c,s,col,n20:v/noteSur(col)*20,coef:k})}}return out}
const moy=L=>{const w=L.reduce((a,x)=>a+x.coef,0);return w?L.reduce((a,x)=>a+x.n20*x.coef,0)/w:null};
const f20=v=>v==null?'–':(Math.round(v*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2});
const perOf=cl=>{const ev=CO(cl).eval==='S'?'S':'T';return O().per[ev].map((p,i)=>Object.assign({key:ev+i},p))};
function agg(e,R){const a={se:0,P:0,A:0,R:0,VS:0,ten:0,inf:0,dis:0,pl:0,mo:0,inc:0,obs:0};
 for(const c of C().cycles)for(const s of c.seances){if(!done(s)||R&&(s.date<R.du||s.date>R.au)||!hasData(c,s))continue;a.se++;let d='';
  for(const col of s.cols){const v=raw(c,col,e.id);
   if(col.type==='appel'&&v)a[v]++;else if(col.type==='tenue'&&v)a.ten++;else if(col.type==='infirmerie'&&v)a.inf++;
   else if(col.type==='dispense'&&v)d=v;else if(col.type==='comportement'&&v)a[{'+':'pl','−':'mo','!':'inc'}[v]]++;
   else if(col.type==='texte'&&v)a.obs++}
  if(d||dispAuto(e.id,s.date))a.dis++}
 return a}
/* Parcours par champ d'apprentissage : séances pratiquées (présent/retard, non dispensé) sur séances saisies */
function caAgg(e,R){const o={};for(const c of C().cycles){if(!c.ca)continue;const x=o[c.ca]||(o[c.ca]={se:0,pr:0,dis:0,ab:0});
 for(const s of c.seances){if(!done(s)||!hasData(c,s)||R&&(s.date<R.du||s.date>R.au))continue;x.se++;let ap='',d='';
  for(const col of s.cols){const v=raw(c,col,e.id);if(col.type==='appel'&&v)ap=v;if(col.type==='dispense'&&v)d=v}
  if(d||dispAuto(e.id,s.date))x.dis++;else if(ap==='P'||ap==='R')x.pr++;else if(ap==='A'||ap==='VS')x.ab++}}return o}
function renderBilan(){$('#view').dataset.cy='';const L=pupils(),K=C(),PS=O().per[CO().eval==='S'?'S':'T'],R=K.bper!=null&&K.bper!=='an'?PS[+K.bper]:null,A=L.map(e=>[e,agg(e,R)]);
 const H=[['se','Séances','📅'],['P','Présent','✅'],['A','Absent','❌'],['VS','Abs. VS','🏫'],['R','Retard','⏰'],['ten','Tenue','👕'],['inf','Infirm.','🩹'],['dis','Disp.','🩺'],['pl','Comport. +','👍'],['mo','Comport. −','👎'],['inc','Incidents','⚠️'],['obs','Obs.','📝']];
 const mx=k=>Math.max(1,...A.map(x=>x[1][k])),warm={VS:'110,140,210',A:'255,90,90',R:'240,195,40',ten:'140,100,255',inf:'120,170,255',dis:'90,140,255',pl:'90,220,140',mo:'240,195,40',inc:'255,80,80',obs:'80,200,230'};
 let h=`<div class="bar"><h2>Bilan · ${esc(S.classe)}</h2><select id="bper" aria-label="Période"><option value="an">Année</option>${PS.map((p,i)=>`<option value="${i}" ${String(K.bper)===String(i)?'selected':''}>${esc(p.nom)}</option>`).join('')}</select><span class="mut">${R?'du '+esc(frD(R.du))+' au '+esc(frD(R.au))+' · ':''}${A[0]?.[1].se??0} séance(s) faite(s) · cliquez sur un élève pour sa synthèse</span></div>`;
 h+=`<div class="grid" style="max-height:none"><table class="bt"><thead><tr class="r1"><th class="st0">Élève</th><th class="st1">Classe</th>${H.map(x=>`<th><span class="ci">${x[2]}</span>${x[1]}</th>`).join('')}<th><span class="ci">📈</span>Assiduité</th></tr></thead><tbody>`
  +A.map(([e,a])=>{const ab=a.A+a.VS,pr=a.P+a.R+ab?Math.round(100*(a.P+a.R)/(a.P+a.R+ab)):null;
   return `<tr><td class="st0"><button class="nm" title="${esc(e.nom.toUpperCase()+' '+e.prenom)}" data-a="fiche" data-e="${esc(e.id)}"><b>${esc(e.nom.toUpperCase())}</b><span class="pn">${esc(e.prenom)}</span></button></td><td class="st1">${esc(e.classe)}</td>`
   +H.map(([k])=>{const n=a[k];return k==='se'||k==='P'?`<td>${n}</td>`:n?`<td class="h" style="background:rgba(${warm[k]},${(.15+.5*n/mx(k)).toFixed(2)})">${n}</td>`:'<td class="z">–</td>'}).join('')
   +`<td>${pr==null?'–':pr+' %'}</td></tr>`}).join('')
  +`</tbody><tfoot><tr><td class="st0">Total</td><td class="st1"></td>${H.map(([k])=>`<td>${k==='se'?(A[0]?.[1].se??0):A.reduce((s,x)=>s+x[1][k],0)}</td>`).join('')}<td></td></tr></tfoot></table></div>`;
 const pk=R?(CO().eval==='S'?'S':'T')+K.bper:'an',CC=((K.cc=K.cc||{})[pk]=K.cc[pk]||{}),pl=R?R.nom:'Année',prov=R&&R.au>today();
 const NT=L.map(e=>[e,notes(K,e.id,R)]),cyN=[...K.cycles].filter(c=>NT.some(([,l])=>l.some(x=>x.c===c))).sort((a,b)=>(a.du||'9').localeCompare(b.du||'9'));
 const cm=f=>{const ms=NT.map(([,l])=>moy(f(l))).filter(x=>x!=null);return ms.length?f20(ms.reduce((a,b)=>a+b,0)/ms.length):'–'};
 h+=`<div class="card"><h3>Moyennes et appréciations · ${esc(pl)}</h3><p class="help">${R?`Notes du ${esc(frD(R.du))} au ${esc(frD(R.au))} (dates de l'Organisation annuelle), tous cycles confondus${prov?' · période en cours : moyennes provisoires':''}`:"Toutes les notes de l'année"}. Notes prises en compte : grilles CompEval et colonnes « Nombre / note » ayant une valeur « Sur », ramenées sur 20 et pondérées par leur coefficient. La moyenne de la période cumule toutes ces notes.</p>
 <div class="grid" style="max-height:none"><table class="mt"><thead><tr class="r1"><th class="st0">Élève</th>${cyN.map(c=>`<th title="${esc(CAS[c.ca]||'')}">${esc(cyName(c))}<br><small>moyenne /20</small></th>`).join('')}<th>Moyenne ${esc(pl)}<br><small>/20</small></th><th>Appréciation du conseil de classe · ${esc(pl)}</th></tr></thead><tbody>`
  +NT.map(([e,l])=>{const g=moy(l);return `<tr><td class="st0"><button class="nm" title="${esc(e.nom.toUpperCase()+' '+e.prenom)}" data-a="fiche" data-e="${esc(e.id)}"><b>${esc(e.nom.toUpperCase())}</b><span class="pn">${esc(e.prenom)}</span></button></td>`

/* ───── Import de la programmation d'équipe (CoordoEPS, application du coordonnateur) ─────
   Fichier { format:'CoordoEPS', org, profs, inst, classes:{ cl:{prof, eval, cren:[{id,jour,hd,hf,sem,inst,prof}], cycles:[{id,nom,ca,du,au,cren,inst}]} } }
   Les créneaux gardent l'id du coordonnateur (marqués pg) ; chaque cycle importé garde l'id d'origine dans « pg » : un nouvel import met à jour au lieu de dupliquer. */
const PROG_LS='CoordoEPS_v1';
function progSrc(){let loc=null;try{loc=JSON.parse(localStorage.getItem(PROG_LS))}catch(e){}
 modal(`<h3>📥 Importer la programmation d'équipe</h3><p class="help">Le coordonnateur EPS prépare avec <b>CoordoEPS</b> un fichier .json : calendrier de l'équipe, créneaux et cycles de chaque classe. Vous choisissez votre nom et vos classes ; les séances déjà saisies sont conservées.</p>
 <div class="bar"><button class="btn b" id="pfi">📂 Choisir le fichier .json</button>${loc&&loc.classes&&Object.keys(loc.classes).length?'<button class="btn r" id="plo">Depuis CoordoEPS sur cet appareil</button>':''}<span class="sp"></span><button class="btn r" data-m="close">Annuler</button></div><p class="msg" id="pm"></p>`,m=>{

$('#fProg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.format!=='CoordoEPS'||!j.classes)throw new Error("ce fichier n'est pas une programmation CoordoEPS");progModal(j)}catch(x){const m=$('#pm');if(m){m.style.color='var(--ko)';m.textContent='❌ '+x.message}}};
function progModal(P){const pr=P.profs||[],pnm=id=>{const p=pr.find(x=>x.id===id);return p?(p.nom+' '+(p.prenom||'')).trim():''},mine=allCls();
 const cls=Object.keys(P.classes).filter(cl=>{const k=P.classes[cl];return(k.cren||[]).length||(k.cycles||[]).length}).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
 const teach=(pid,cl)=>{const k=P.classes[cl];return k.prof===pid||(k.cren||[]).some(c=>c.prof===pid)};
 const nz=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const guess=cl=>{const m=(S.progMap||{})[cl];if(m&&mine.includes(m))return m;return mine.find(c=>nz(c)===nz(cl))||''};
 modal(`<h3>📥 Programmation ${esc(P.etab||'de l\'équipe')} ${esc(P.annee||'')}</h3><p class="help">Préparée par ${esc(P.auteur||'le coordonnateur')}${P.genere?' le '+esc(new Date(P.genere).toLocaleDateString('fr-FR')):''} · ${cls.length} classe(s) programmée(s).</p>
 <form id="f"><label>Je suis<select name="me"><option value="">— toute l'équipe (toutes les classes) —</option>${pr.map(p=>`<option value="${esc(p.id)}">${esc(pnm(p.id))}</option>`).join('')}</select></label>
 <label>Classes à importer</label><div class="refs" id="pcl" style="max-height:300px"></div>
 <p class="help">La programmation a été préparée avec des noms de classes prévus, avant les listes Pronote. Si un nom prévu ne correspond pas à votre liste, choisissez la classe réelle dans le menu (ou gardez le nom prévu).</p>
 <label class="chk"><input type="checkbox" name="cal" checked> Reprendre le calendrier de l'équipe (année, vacances, fériés, semaines A/B, interruptions, trimestres/semestres)</label>
 <label class="chk"><input type="checkbox" name="gen" checked> Générer les séances des cycles importés (les séances d'évaluation sont nommées : fin de cycle, CCF…)</label>
 <p class="help">Les créneaux et cycles importés remplacent ceux d'un import précédent ; vos cycles créés à la main et toutes vos saisies sont conservés. Un cycle retiré par le coordonnateur n'est supprimé que s'il ne contient aucune saisie.</p>
 <div class="bar"><button class="btn">📥 Importer</button><span class="sp"></span><button type="button" class="btn r" data-m="close">Annuler</button></div><p class="msg" id="pm"></p></form>`,m=>{
  const f=m.querySelector('#f'),draw=()=>{const me=f.me.value;m.querySelector('#pcl').innerHTML=cls.map(cl=>{const k=P.classes[cl],ok=mine.includes(cl),g=ok?cl:guess(cl);
   return `<div class="chk" style="flex-wrap:wrap"><input type="checkbox" name="cl" value="${esc(cl)}" ${!me||teach(me,cl)?'checked':''} aria-label="${esc(cl)}"> <b>${esc(cl)}</b>

   <span class="help" style="flex-basis:100%;margin:0 0 0 28px">${esc(pnm(k.prof)||'—')} · ${(k.cren||[]).length} créneau(x) · ${(k.cycles||[]).length} cycle(s)${ok||mine.length?'':' · ⚠ aucune liste d\'élèves sur cet appareil'}</span></div>`}).join('')||'<p class="help">Aucune classe programmée dans ce fichier.</p>'};
  const me0=P.pour||S.progMoi||'';if(pr.some(p=>p.id===me0))f.me.value=me0;f.me.onchange=draw;draw();
  f.onsubmit=e=>{e.preventDefault();const L=[...f.querySelectorAll('[name=cl]:checked')].map(x=>{const s=f.querySelector(`[data-map="${CSS.escape(x.value)}"]`);return[x.value,(s&&s.value)||x.value]});
   if(!L.length){m.querySelector('#pm').textContent='⚠ Cochez au moins une classe';return}
   const T=L.map(x=>x[1]);if(new Set(T).size<T.length){m.querySelector('#pm').textContent='⚠ Deux classes prévues pointent vers la même classe réelle';return}
   S.progMoi=f.me.value;S.progMap=S.progMap||{};L.forEach(([a,b])=>{if(a!==b)S.progMap[a]=b;else delete S.progMap[a]});
   const r=applyProg(P,f.me.value,L,f.cal.checked,f.gen.checked);
   OM=`✅ ${L.length} classe(s) importée(s) : ${r.nc} cycle(s) créé(s), ${r.nu} mis à jour${r.nd?', '+r.nd+' retiré(s)':''}${f.gen.checked?', '+r.ad+' séance(s) ajoutée(s), '+r.ne+' séance(s) d\'évaluation':''}`;
   if(!S.orgCl||!T.includes(S.orgCl))S.orgCl=T.find(c=>mine.includes(c))||S.orgCl;if(!T.includes(S.classe)&&!(S.classes[S.classe]?.cycles||[]).length){const c=T.find(c=>mine.includes(c));if(c)S.classe=c}
   S.view='org';save();close();render()}})}
/* L : [[classe prévue dans CoordoEPS, classe réelle dans SuiviProf], …] */
function applyProg(P,me,L,cal,gen){const inst=id=>(P.inst||[]).find(i=>i.id===id)?.nom||'';let nc=0,nu=0,nd=0,ad=0,ne=0;
 const evT=t=>t==='Fin de cycle'?'Évaluation de fin de cycle':t==='Diagnostique'?'Évaluation diagnostique':t==='Intermédiaire'?'Évaluation intermédiaire':t;
 if(cal&&P.org){S.org=JSON.parse(JSON.stringify(P.org));const o=O();o.flip=o.flip||[];o.inter=o.inter||[];o.vac=o.vac||[]}FER=WK=null;
 for(const[pc,cl]of L){const src=P.classes[pc];if(!src)continue;const K=KL(cl),co=CO(cl);
  let cr=src.cren||[],part=false;if(me){const x=cr.filter(c=>(c.prof||src.prof)===me);if(x.length&&x.length<cr.length){cr=x;part=true}}
  const ids=new Set(cr.map(c=>c.id));if(src.eval)co.eval=src.eval;
  co.cren=[...co.cren.filter(c=>!c.pg&&!ids.has(c.id)),...cr.map(c=>({id:c.id,jour:+c.jour,hd:c.hd,hf:c.hf,sem:c.sem||'AB',lieu:inst(c.inst),pg:1}))];
  const keep=new Set();
  for(const s of src.cycles||[]){const cc=(s.cren||[]).filter(id=>ids.has(id));if(part&&!cc.length)continue;keep.add(s.id);
   let c=K.cycles.find(x=>x.pg===s.id);if(c)nu++;else{c={id:uid(),pg:s.id,seq:0,seances:[],vals:{}};K.cycles.push(c);nc++}
   Object.assign(c,{nom:s.nom||'Cycle',ca:s.ca||'',du:s.du||'',au:s.au||'',cren:cc,evals:(s.evals||[]).filter(v=>v.date).map(v=>({type:v.type,date:v.date})),lieu:inst(s.inst)||[...new Set(cr.filter(x=>cc.includes(x.id)).map(x=>inst(x.inst)).filter(Boolean))].join(' / ')})}
  K.cycles=K.cycles.filter(c=>{if(!c.pg||keep.has(c.pg))return true;if(c.seances.some(s=>hasData(c,s)))return true;nd++;return false});
  if(K.tab&&!K.cycles.some(c=>c.id===K.tab))K.tab=null;
  if(gen)for(const c of K.cycles){if(!c.pg)continue;if(c.du&&c.au&&c.cren.length)ad+=generate(cl,c).add;
   /* séances d'évaluation : titre posé par l'import (s.evt), jamais un titre saisi par l'enseignant */
   for(const s of c.seances)if(s.evt&&!(c.evals||[]).some(v=>v.date===s.date)){if(s.titre===s.evt)s.titre='';delete s.evt}
   const G=new Map();for(const v of c.evals||[])G.set(v.date,[...(G.get(v.date)||[]),evT(v.type)]);
   for(const[d,ts]of G){const s=c.seances.find(x=>x.date===d&&!x.annulee);if(!s)continue;const t=[...new Set(ts)].join(' + ');if(!s.titre||s.titre===s.evt){s.titre=t;s.evt=t}ne++}}}
 S.prog={etab:P.etab||'',annee:P.annee||'',auteur:P.auteur||'',genere:P.genere||'',date:new Date().toISOString()};return{nc,nu,nd,ad,ne}}

 if(a==='cyc'||a==='tog'){const eid=b.dataset.e,v=raw(c,col,eid);
  if(a==='tog')setVal(eid,col.id,v?'':1);else{const st=T(col).st;setVal(eid,col.id,st[(st.indexOf(v||'')+1)%st.length])}
  const sea=c.seances.find(x=>x.cols.includes(col)),td=b.parentElement,j=sea.cols.indexOf(col);td.outerHTML=cell(c,sea,col,E.find(x=>x.id===eid),j);refreshLive()}});

 if(b.dataset.a==='sel')setVal(b.dataset.e,col.id,b.value);
 else{const t=T(col);if(t.k==='text')setVal(b.dataset.e,col.id,b.value.trim());

/* Fichier Pronote réunissant plusieurs classes : proposer un groupe d'enseignement (comme le portail, eps-core v2.5) */
function choixGroupe(a){return new Promise(ok=>{modal(`<h3>👥 Groupe d'enseignement ?</h3><p class="help">Ce fichier réunit ${a.n} élève(s) de ${a.classes.length} classes : ${a.classes.map(c=>esc(c.nom||'?')+' ('+c.n+')').join(', ')}.</p>
 <label>Nom du groupe<input id="grn" value="${esc(a.suggestion||'')}"></label><p class="help">Les élèves gardent leur classe et sont ajoutés à ce groupe, qui devient un carnet dans SuiviProf (comme une classe).</p>
 <div class="bar"><button class="btn" id="gro">👥 Importer comme groupe</button><button class="btn r" id="grc">Classes séparées</button><span class="sp"></span><button class="btn r" id="gra">Annuler</button></div>`,m=>{
  PEND=ok;const fin=v=>{PEND=null;close();ok(v)};
  m.querySelector('#gro').onclick=()=>{const v=m.querySelector('#grn').value.trim();if(!v){m.querySelector('#grn').focus();return}fin({groupe:v})};
  m.querySelector('#grc').onclick=()=>fin({});m.querySelector('#gra').onclick=()=>fin(null)})})}
/* Import direct d'une ou plusieurs listes Pronote (.csv) ou Mes Apps EPS (.xlsx) : utilisable sans le portail */
$('#fList').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;let add=0,upd=0;const err=[];
 for(const f of fs){let opt={};if(!/\.xlsx$/i.test(f.name)){try{const a=await EPS.analyserCSV(f);if(a.classes.length>1){opt=await choixGroupe(a);if(opt===null){err.push(f.name+' : import annulé');continue}}}catch(x){}}
  try{const r=await EPS.importFile(f,opt);add+=r.add??0;upd+=r.upd??0}catch(x){err.push(f.name+' : '+x.message)}}
 E=await EPS.all();AUTO=true;const n=allCls().length;$('#st').style.color=err.length?'var(--ko)':'var(--ok)';
 $('#st').textContent=`${err.length?'⚠':'✅'} ${fs.length} fichier(s) : ${add} élève(s) ajouté(s), ${upd} mis à jour · ${n} classe(s)`+(err.length?' · '+err.join(' ; '):'');close();render()};
$('#fJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());const msg=restaurerCarnet(j);close();render();$('#st').style.color='var(--ok)';$('#st').textContent='✅ Carnet restauré.'+msg}catch(x){const m=$('#sm')||$('#st');if(m)m.textContent='❌ '+x.message}};
